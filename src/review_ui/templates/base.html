<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Animation Studio{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation -->
    <header class="navbar">
        <div class="navbar-brand">
            <a href="/">Animation Studio</a>
        </div>
        <nav class="navbar-links">
            <a href="/" class="{% if page == 'dashboard' %}nav-active{% endif %}">Dashboard</a>
            <a href="/motion" class="{% if page == 'motion' %}nav-active{% endif %}">Motion</a>
            <a href="/music" class="{% if page == 'music' %}nav-active{% endif %}">Music</a>
            <span class="nav-badge">PHASE 1-5</span>
        </nav>
    </header>

    <!-- Main content -->
    <main class="content">
        {% block content %}
        <p>Content area — extend this template.</p>
        {% endblock %}
    </main>

    <!-- Toast notifications (studio.js) -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <footer class="footer">
        <p>Animation Studio — PHASE 1-4 Production Tools</p>
    </footer>

    <script src="/static/studio.js"></script>
</body>
</html>
